/* Main Styles CSS */
:root {
  --white-color: #fff;
  --black-color: #000;
  --text-color: #333;

  --header-height: 124px;
  --width-btn: 340px;
}

/* reset css */
* {
  margin: 0;
  padding: 0;
  box-sizing: border-box;
}

html {
  font-size: 62.5%;
  line-height: 1.6rem;
  font-family: "Pacifico", cursive;
  height: 100vh;
}

html::-webkit-scrollbar {
  width: 2px;
  background-color: #ccc;
}

body {
  height: 100%;
  cursor: url(https://cur.cursors-4u.net/symbols/sym-1/sym49.cur), auto !important;
}

canvas {
  position: absolute;
  width: 100%;
  height: 100%;
}

.container {
  height: 100%;
  display: flex;
  overflow: hidden;
  flex-direction: column;
  flex: 1;
  background-image: linear-gradient(to right top, #5998C5, #419D78);
  animation: changeColor 4s ease-in-out;
  -webkit-animation: changeColor 4s ease-in-out;
  -moz-animation: changeColor 4s ease-in-out;
  -o-animation: changeColor 4s ease-in-out;
  animation-iteration-count: infinite;
}

@keyframes changeColor {
  from {
    background-image: linear-gradient(to left, #5998C5, #419D78);
  }
  to {
    background-image: linear-gradient(to top, #5998C5, #419D78);
  }
}

/* Header */
.header {

  z-index: 3;
}

}

.header-description {
  font-size: 2rem;
  color: var(--text-color);
  padding: 10px 0;

}

  justify-content: space-evenly;

/* Preloader */
#preloader {
  position: fixed;
  top: 0;
  left: 0;
  right: 0;
  bottom: 0;
  z-index: 9999999;
  background-color: var(--white-color);
  opacity: 1;
}

.spinner {
  position: absolute;
  left: 50%; /* centers the loading animation horizontally one the screen */
  top: 50%; /* centers the loading animation vertically one the screen */
  width: 50px;
  height: 30px;
  text-align: center;
  font-size: 10px;
  margin-left: -25px;
}

.spinner .dashed-loading {
  position: relative;
  height: 50px;
}

.dashed-loading:after,
.dashed-loading:before {
  content: "";
  position: absolute;
  top: 0;
  left: 0;
  border-radius: 50%;
  width: 50px;
  height: 50px;
}
.dashed-loading:before {
  /* z-index: 5; */
  border: 3px dashed #5998C5;
  border-left: 3px solid transparent;
  border-bottom: 3px solid transparent;
  -webkit-animation: dashed 1s linear infinite;
  animation: dashed 1s linear infinite;
}
.dashed-loading:after {
  /* z-index: 10; */
  border: 3px solid #5998C5;
  border-left: 3px solid transparent;
  border-bottom: 3px solid transparent;
  -webkit-animation: dashed 1s ease infinite;
  animation: dashed 1s ease infinite;
}
@keyframes dashed {
  to {
    transform: rotate(360deg);
  }
}

    <script>
// CONFIG.js
const CONFIGDATA = {
  titleHeader: "Chào em, anh có điều muốn nói. </br> Làm người yêu anh nhé!",
  descriptionHeader:
    "Hãy trả lời một cách thật lòng nhé. Nếu em im lặng và rời đi thì tức là em đã ĐỒNG Ý.",
  buttonYes: "em đồng ý",
  buttonNo: "Không đồng ý",
  titleModar: "Cảm ơn em.",
  descriptionModar:
    "Cảm ơn em đã cho anh một cơ hội để anh có thể ở bên cạnh, che chở và bảo vệ em. </br> Anh biết anh không được đẹp trai, cũng chẳng lắm tài nhưng anh có một trái tim chân thành. Em chính là cả thế giới của anh. </br> Tối nay anh sẽ đến đón em. Em mặc thật đẹp vào nhé! Sẽ có một bất ngờ dành cho em.</br> Love you <3",
};

// setting.js
const settings = {
  particles: {
    length: 500, // maximum amount of particles

    duration: 2, // particle duration in sec

    velocity: 120, // particle velocity in pixels/sec

    effect: -0.75, // play with this for a nice effect

    size: 30, // particle size in pixels
  },
};

// RequestAnimationFrame.js
/*
 * RequestAnimationFrame polyfill by Erik Möller
 */

(function () {
  var b = 0;
  var c = ["ms", "moz", "webkit", "o"];
  for (var a = 0; a < c.length && !window.requestAnimationFrame; ++a) {
    window.requestAnimationFrame = window[c[a] + "RequestAnimationFrame"];
    window.cancelAnimationFrame =
      window[c[a] + "CancelAnimationFrame"] ||
      window[c[a] + "CancelRequestAnimationFrame"];
  }
  if (!window.requestAnimationFrame) {
    window.requestAnimationFrame = function (h, e) {
      var d = new Date().getTime();
      var f = Math.max(0, 16 - (d - b));
      var g = window.setTimeout(function () {
        h(d + f);
      }, f);
      b = d + f;
      return g;
    };
  }
  if (!window.cancelAnimationFrame) {
    window.cancelAnimationFrame = function (d) {
      clearTimeout(d);
    };
  }
})();

// heartParticle.js
/*
 * Point class
 */

let pinkBoard = document.getElementById("pinkboard")

const Point = (function () {
  function Point(x, y) {
    this.x = typeof x !== "undefined" ? x : 0;

    this.y = typeof y !== "undefined" ? y : 0;
  }

  Point.prototype.clone = function () {
    return new Point(this.x, this.y);
  };

  Point.prototype.length = function (length) {
    if (typeof length == "undefined")
      return Math.sqrt(this.x * this.x + this.y * this.y);

    this.normalize();

    this.x *= length;

    this.y *= length;

    return this;
  };

  Point.prototype.normalize = function () {
    var length = this.length();

    this.x /= length;

    this.y /= length;

    return this;
  };

  return Point;
})();

/*
 * Particle class
 */

const Particle = (function () {
  function Particle() {
    this.position = new Point();
    this.velocity = new Point();
    this.acceleration = new Point();
    this.age = 0;
  }

  Particle.prototype.initialize = function (x, y, dx, dy) {
    this.position.x = x;

    this.position.y = y;

    this.velocity.x = dx;

    this.velocity.y = dy;

    this.acceleration.x = dx * settings.particles.effect;

    this.acceleration.y = dy * settings.particles.effect;

    this.age = 0;
  };

  Particle.prototype.update = function (deltaTime) {
    this.position.x += this.velocity.x * deltaTime;

    this.position.y += this.velocity.y * deltaTime;

    this.velocity.x += this.acceleration.x * deltaTime;

    this.velocity.y += this.acceleration.y * deltaTime;

    this.age += deltaTime;
  };

  Particle.prototype.draw = function (context, image) {
    function ease(t) {
      return --t * t * t + 1;
    }

    var size = image.width * ease(this.age / settings.particles.duration);

    context.globalAlpha = 1 - this.age / settings.particles.duration;

    context.drawImage(
      image,
      this.position.x - size / 2,
      this.position.y - size / 2,
      size,
      size
    );
  };

  return Particle;
})();

/*
 * ParticlePool class
 */

const ParticlePool = (function () {
  let particles,
    firstActive = 0,
    firstFree = 0,
    duration = settings.particles.duration;

  function ParticlePool(length) {
    // create and populate particle pool

    particles = new Array(length);

    for (let i = 0; i < particles.length; i++) particles[i] = new Particle();
  }

  ParticlePool.prototype.add = function (x, y, dx, dy) {
    particles[firstFree].initialize(x, y, dx, dy);

    // handle circular queue

    firstFree++;

    if (firstFree == particles.length) firstFree = 0;

    if (firstActive == firstFree) firstActive++;

    if (firstActive == particles.length) firstActive = 0;
  };

  ParticlePool.prototype.update = function (deltaTime) {
    var i;

    // update active particles

    if (firstActive < firstFree) {
      for (i = firstActive; i < firstFree; i++) particles[i].update(deltaTime);
    }

    if (firstFree < firstActive) {
      for (i = firstActive; i < particles.length; i++)
        particles[i].update(deltaTime);

      for (i = 0; i < firstFree; i++) particles[i].update(deltaTime);
    }

    // remove inactive particles

    while (particles[firstActive].age >= duration && firstActive != firstFree) {
      firstActive++;

      if (firstActive == particles.length) firstActive = 0;
    }
  };

  ParticlePool.prototype.draw = function (context, image) {
    // draw active particles

    if (firstActive < firstFree) {
      for (i = firstActive; i < firstFree; i++)
        particles[i].draw(context, image);
    }

    if (firstFree < firstActive) {
      for (i = firstActive; i < particles.length; i++)
        particles[i].draw(context, image);

      for (i = 0; i < firstFree; i++) particles[i].draw(context, image);
    }
  };

  return ParticlePool;
})();

/*
 * Putting it all together
 */

(function (canvas) {
  let context = canvas.getContext("2d"),
    particles = new ParticlePool(settings.particles.length),
    particleRate = settings.particles.length / settings.particles.duration, // particles/sec
    time;

  // get point on heart with -PI <= t <= PI

  function pointOnHeart(t) {
    return new Point(
      160 * Math.pow(Math.sin(t), 3),

      130 * Math.cos(t) -
        50 * Math.cos(2 * t) -
        20 * Math.cos(3 * t) -
        10 * Math.cos(4 * t) +
        25
    );
  }

  // creating the particle image using a dummy canvas

  var image = (function () {
    var canvas = document.createElement("canvas"),
      context = canvas.getContext("2d");

    canvas.width = settings.particles.size;

    canvas.height = settings.particles.size;

    // helper function to create the path

    function to(t) {
      var point = pointOnHeart(t);

      point.x =
        settings.particles.size / 2 + (point.x * settings.particles.size) / 350;

      point.y =
        settings.particles.size / 2 - (point.y * settings.particles.size) / 350;

      return point;
    }

    // create the path

    context.beginPath();

    var t = -Math.PI;

    var point = to(t);

    context.moveTo(point.x, point.y);

    while (t < Math.PI) {
      t += 0.01; // baby steps!

      point = to(t);

      context.lineTo(point.x, point.y);
    }

    context.closePath();

    // create the fill

    context.fillStyle = "#B8336A";

    context.fill();

    // create the image

    var image = new Image();

    image.src = canvas.toDataURL();

    return image;
  })();

  // render that thing!

  function render() {
    // next animation frame

    requestAnimationFrame(render);

    // update time

    var newTime = new Date().getTime() / 1000,
      deltaTime = newTime - (time || newTime);

    time = newTime;

    // clear canvas

    context.clearRect(0, 0, canvas.width, canvas.height);

    // create new particles

    var amount = particleRate * deltaTime;

    for (var i = 0; i < amount; i++) {
      var pos = pointOnHeart(Math.PI - 2 * Math.PI * Math.random());

      var dir = pos.clone().length(settings.particles.velocity);

      particles.add(
        canvas.width / 2 + pos.x,
        canvas.height / 2 - pos.y,
        dir.x,
        -dir.y
      );
    }

    // update and draw particles

    particles.update(deltaTime);

    particles.draw(context, image);
  }

  // handle (re-)sizing of the canvas

  function onResize() {
    canvas.width = canvas.clientWidth;

    canvas.height = canvas.clientHeight;
  }

  window.onresize = onResize;

  // delay rendering bootstrap

  setTimeout(function () {
    onResize();

    render();
  }, 10);
})(pinkBoard);

    btnNo.style.right = y + "px";
  };
}
